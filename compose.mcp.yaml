services:
  backend:
    build:
      context: .
      dockerfile: service/api/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PYTHONPATH: "/app:/app/src"
      GATEWAY_INTERNAL_AUTH_SECRET: "local-dev-gateway-secret"
      # Local E2E requires the hybrid collection shape because the runtime
      # injects a sparse embedder and indexes/searches dense+sparse vectors.
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-mcp_tools_hybrid}
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health').read()"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      - gateway

  our-mcp-server-dev:
    build:
      context: .
      dockerfile: service/api/Dockerfile
    env_file:
      - .env
    command:
      - /app/.venv/bin/uvicorn
      - service.mcp_server.local_app:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - "8080:8080"
    environment:
      PYTHONPATH: "/app:/app/src"
      MLP_MCP_LOCAL_MOCK: "1"
      MLP_MCP_BASE_URL: "http://127.0.0.1:8080"
      MLP_FRONTEND_URL: "http://127.0.0.1:3001"
      MLP_BACKEND_URL: "http://backend:3000"
      GATEWAY_URL: "http://gateway:8000"
      GATEWAY_INTERNAL_AUTH_SECRET: "local-dev-gateway-secret"
    depends_on:
      gateway:
        condition: service_started
      backend:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: service/gateway/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      GATEWAY_INTERNAL_AUTH_SECRET: "local-dev-gateway-secret"
      MOCK_PROVIDER_SERVER_ID: "mock-provider"
      MOCK_PROVIDER_MCP_URL: "http://mock-provider-mcp-http:8090/mcp"
    depends_on:
      - mock-provider-mcp-http

  mock-provider-mcp-http:
    image: python:3.12-slim
    working_dir: /workspace
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn &&
      uvicorn service.mcp_server.mock_provider:app --host 0.0.0.0 --port 8090"
    volumes:
      - .:/workspace:ro
    environment:
      PYTHONPATH: "/workspace:/workspace/src"
    ports:
      - "8090:8090"

  frontend:
    build:
      context: .
      dockerfile: service/ops/frontend/Dockerfile
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
        VITE_API_URL: "http://localhost:3000"
        VITE_MLP_API_KEY: ${MLP_API_KEY:-}
        VITE_HOSTED_CONNECT_ENABLED: "true"
    ports:
      - "3001:80"
    depends_on:
      - backend
      - our-mcp-server-dev
