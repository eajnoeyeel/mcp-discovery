[project]
name = "mcp-discovery"
version = "0.1.0"
description = "MCP Discovery Platform — find the best MCP tool for any query"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "qdrant-client>=1.12.0",
    "openai>=1.60.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "langfuse>=2.0.0",
    "mcp>=1.0",
    "wandb>=0.19.0",
    "scipy>=1.14.0",
    "numpy>=2.0.0",
    "loguru>=0.7.0",
    "pyarrow>=23.0.1",
    "boto3>=1.42.83",
    "fastembed>=0.8.0",
    "tiktoken>=0.12.0",
    "aioboto3>=7.0.0",
    "aiofiles>=25.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]
experiment = [
    "anthropic>=0.49.0",
    "google-generativeai>=0.8.0",
]

# --- Lambda function dependency groups ---
# Source of Truth for per-function requirements.txt.
# Generate: uv export --only-group lambda-<name> --no-hashes > service/lambdas/<name>/requirements.txt
# CI check: re-generate and verify no diff.
lambda-authorizer = []  # stdlib only
lambda-register = [
    "boto3>=1.42",
    "httpx>=0.28",
    "loguru>=0.7",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "sniffio>=1.3",
]
lambda-execute = [
    "boto3>=1.42",
    "httpx>=0.28",
    "loguru>=0.7",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",    "sniffio>=1.3",
]
lambda-catalog = [
    "httpx>=0.28",
    "loguru>=0.7",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
]
lambda-dashboard = [
    "httpx>=0.28",
    "loguru>=0.7",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
]
lambda-health = [
    "httpx>=0.28",
    "loguru>=0.7",
]
lambda-index = [
    "fastembed>=0.8.0",
    "httpx>=0.28",
    "loguru>=0.7",
    "numpy>=2.0",
    "openai>=1.60",
    "onnxruntime>=1.0.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "qdrant-client>=1.12",    "sniffio>=1.3",
]
# DLQ consumer: handoff only (EB publish + Supabase status flip). No embedding.
# boto3 is required for EventBridge PutEvents (event-driven republish per ADR-0024).
lambda-index-dlq-consumer = [
    "boto3>=1.42",
    "httpx>=0.28",
    "loguru>=0.7",
    "pydantic>=2.10",
]
# search와 bridge는 동일 의존성 — 하나의 그룹으로 관리
lambda-search-bridge = [
    "boto3>=1.42",
    "fastembed>=0.8.0",
    "httpx>=0.28",
    "loguru>=0.7",
    "numpy>=2.0",
    "openai>=1.60",
    "onnxruntime>=1.0.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "qdrant-client>=1.12",    "sniffio>=1.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "service/rag/tests"]
pythonpath = ["src", "scripts", "."]
markers = [
    "integration: marks tests as integration tests (multi-module pipeline, no live APIs required)",
]

[tool.coverage.run]
omit = [
    "service/rag/tests/*",
    "service/build/*",
    "service/harness/*",
    "service/gateway/main.py",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]  # sys.path.insert before imports is intentional
"service/lambdas/*/handler.py" = ["E402"]  # sys.path for local dev before src/ imports
"service/scripts/*.py" = ["E402"]  # same pattern
